name: build-release

# 双平台构建：打 tag（v*）自动打包并发布 GitHub Release；
# 也可在 Actions 页面手动触发（workflow_dispatch，仅出 artifacts 不发 Release）。
# 发行版授权服务器地址配在仓库 Secrets 的 DIST_SERVER_URL（不配 = 自用直连版）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: BiliParser-macOS.dmg
          - os: windows-latest
            artifact: BiliParser-Setup-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 烧入发行服务器（可选）
        shell: bash
        run: |
          if [ -n "${{ secrets.DIST_SERVER_URL }}" ]; then
            printf '%s' "${{ secrets.DIST_SERVER_URL }}" > packaging/_dist_server.txt
            echo "发行版：已烧入授权服务器"
          else
            echo "未配置 DIST_SERVER_URL → 自用直连版"
          fi

      - name: 安装依赖并打包
        shell: bash
        run: |
          pip install -e . pywebview pyinstaller
          pyinstaller packaging/biliparser.spec --noconfirm --clean

      - name: macOS 封 DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dist/dmg-staging && mkdir -p dist/dmg-staging
          cp -R dist/BiliParser.app dist/dmg-staging/
          ln -s /Applications dist/dmg-staging/Applications
          hdiutil create -volname BiliParser -srcfolder dist/dmg-staging \
            -ov -format UDZO dist/BiliParser-macOS.dmg >/dev/null

      - name: Windows 封安装器（Inno Setup）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 不依赖 Chocolatey（新版 runner 已移除）。官方安装包只在 GitHub Releases：
          # 动态取最新版 x64 安装器，失败则退回固定版本。
          $url = $null
          try {
            $rel = Invoke-RestMethod "https://api.github.com/repos/jrsoftware/issrc/releases/latest" `
              -Headers @{ "User-Agent" = "ci" }
            $url = ($rel.assets | Where-Object { $_.name -like "innosetup-*-x64.exe" } |
                    Select-Object -First 1).browser_download_url
            Write-Host "Inno 最新版：$($rel.tag_name) → $url"
          } catch { Write-Host "查询最新版失败：$_" }
          if (-not $url) { $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" }
          Invoke-WebRequest -Uri $url -OutFile isetup.exe -UseBasicParsing
          Write-Host "安装器大小：$((Get-Item isetup.exe).Length) 字节"
          Start-Process -Wait -FilePath ".\isetup.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/PORTABLE=1","/DIR=C:\InnoSetup"
          & "C:\InnoSetup\ISCC.exe" "/DRepoRoot=$env:GITHUB_WORKSPACE" "packaging\biliparser.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 编译失败：$LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
