[project]
name = "biliparser"
# uv_build 不支持 dynamic version，只能写死；真源是 src/biliparser/__init__.py:__version__，
# 由 tests/test_version_sync.py 兜底校验两处一致（bump 时别只改一处）。
version = "0.2.5"
description = "BiliParser — B 站视频字幕提取与 AI 总结 CLI"
readme = "README.md"
authors = [
    { name = "liuhaifengs", email = "liuhaifengs@zwcax.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
biliparse = "biliparser.cli:main"
biliparse-web = "biliparser.web:main"
biliparser-desktop = "biliparser.desktop:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
desktop = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]
asr = [
    "faster-whisper>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
