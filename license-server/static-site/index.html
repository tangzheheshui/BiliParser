<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiliParser — B 站视频 AI 智能总结</title>
<style>
:root{--bg:#101418;--panel:#171d24;--panel2:#1d2530;--line:#2a3542;--text:#dce4ee;--dim:#8b98a8;--accent:#4da3ff;--accent2:#7ec8ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background-image:radial-gradient(800px 400px at 50% -100px,rgba(77,163,255,.12),transparent)}
.wrap{max-width:720px;margin:0 auto;padding:72px 24px 40px;text-align:center}
.logo{font-size:56px;line-height:1;margin-bottom:14px;background:linear-gradient(135deg,#4da3ff,#7ec8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1{font-size:34px;font-weight:700;letter-spacing:.5px}
.tag{color:var(--dim);font-size:16px;margin-top:8px}
.ver{color:var(--dim);font-size:13px;margin-top:14px;min-height:20px}
.dl{display:flex;gap:16px;margin:44px 0;flex-wrap:wrap}
.dl a{flex:1;min-width:230px;display:block;padding:22px 18px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--text);background:var(--panel);transition:.15s}
.dl a:hover{border-color:var(--accent);transform:translateY(-2px)}
.dl a.hot{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,163,255,.15);background:rgba(77,163,255,.06)}
.dl .os{font-size:19px;font-weight:600}
.dl .os small{color:var(--accent2);font-weight:400;font-size:12px;margin-left:6px}
.dl .fname{color:var(--dim);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
.dl .note{color:var(--dim);font-size:12px;margin-top:6px}
.feats{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 28px;margin-top:12px}
.feats h2{font-size:15px;margin-bottom:12px;color:var(--accent2)}
.feats li{list-style:none;padding:5px 0;color:var(--dim);font-size:14px}
.feats li::before{content:"· ";color:var(--accent)}
footer{color:var(--dim);font-size:12px;margin-top:48px;opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">✦</div>
  <h1>BiliParser</h1>
  <p class="tag">B 站视频 · AI 智能总结</p>
  <p class="ver" id="ver">获取版本号…</p>

  <div class="dl">
    <a href="/download/BiliParser-macOS.dmg" id="dl-mac">
      <div class="os">macOS <small id="mac-tag"></small></div>
      <div class="fname">BiliParser-macOS.dmg</div>
      <div class="note">下载后拖入「应用程序」</div>
    </a>
    <a href="/download/BiliParser-Setup-Windows.exe" id="dl-win">
      <div class="os">Windows <small id="win-tag"></small></div>
      <div class="fname">BiliParser-Setup-Windows.exe</div>
      <div class="note">双击安装，无需管理员</div>
    </a>
  </div>

  <div class="feats">
    <h2>功能</h2>
    <li>一键提取 B 站视频字幕（UP 上传 + AI 字幕）</li>
    <li>AI 生成结构化总结：一句话 / 核心要点 / 章节时间线 / 关键词</li>
    <li>思维导图随总结自动生成，可导出</li>
    <li>支持智谱 GLM / DeepSeek 自有 Key 直连</li>
  </div>

  <footer>激活码由卖家提供 · 一码通用 · 桌面与网页版共享</footer>
</div>
<script>
(function(){
  // 自动高亮访客系统
  var ua = navigator.userAgent, isMac = /Mac|iPhone|iPad/i.test(ua);
  var macEl = document.getElementById('dl-mac'), winEl = document.getElementById('dl-win');
  if (isMac) { macEl.classList.add('hot'); document.getElementById('mac-tag').textContent='（你的系统）'; }
  else { winEl.classList.add('hot'); document.getElementById('win-tag').textContent='（你的系统）'; }
  // 读版本号（sync 脚本生成的 version.json）
  fetch('/download/version.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (d && d.version) document.getElementById('ver').textContent = '最新版本 ' + d.version + ' · 更新于 ' + d.updated;
      else document.getElementById('ver').textContent = '';
    })
    .catch(function(){ document.getElementById('ver').textContent = ''; });
})();
</script>
</body>
</html>
