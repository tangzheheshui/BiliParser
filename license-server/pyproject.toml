[project]
name = "biliparser-license-server"
version = "0.2.0"
description = "BiliParser 授权服务器：激活码库存管理 + 一次性激活鉴权 + 管理后台"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=23.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
